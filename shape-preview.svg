<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 820" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="0" y="0" width="1140" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1a1a1a">FactoryXChange service map — proposed shape</text>
  <text x="40" y="72" font-size="14" fill="#667">The live map is draggable / force-directed like the practice map you saw. This just shows the wiring.</text>

  <!-- ================= EDGES (drawn first, under nodes) ================= -->
  <!-- AI hub to its 3 services (solid) -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="380" y1="300" x2="235" y2="175"/>
    <line x1="380" y1="300" x2="205" y2="300"/>
    <line x1="380" y1="300" x2="235" y2="425"/>
  </g>
  <!-- services to partners (dashed = delivered-by) -->
  <g stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="235" y1="175" x2="190" y2="150"/>
    <line x1="205" y1="300" x2="190" y2="303"/>
    <line x1="235" y1="425" x2="190" y2="462"/>
  </g>
  <!-- faint dots to their hubs (other categories have services too) -->
  <g stroke="#dfe6e9" stroke-width="1.6">
    <line x1="660" y1="160" x2="742" y2="112"/><line x1="660" y1="160" x2="600" y2="104"/><line x1="660" y1="160" x2="726" y2="218"/>
    <line x1="850" y1="330" x2="928" y2="298"/><line x1="850" y1="330" x2="918" y2="388"/><line x1="850" y1="330" x2="858" y2="428"/>
    <line x1="740" y1="560" x2="820" y2="618"/><line x1="740" y1="560" x2="678" y2="628"/><line x1="740" y1="560" x2="812" y2="498"/>
    <line x1="470" y1="640" x2="428" y2="720"/><line x1="470" y1="640" x2="548" y2="708"/><line x1="470" y1="640" x2="388" y2="578"/>
    <line x1="210" y1="600" x2="118" y2="648"/><line x1="210" y1="600" x2="262" y2="676"/><line x1="210" y1="600" x2="138" y2="548"/>
  </g>

  <!-- ================= PARTNER NODES (rounded rects) ================= -->
  <g font-size="12.5" fill="#2d3436">
    <rect x="20" y="133" width="170" height="34" rx="8" fill="#eef2f3" stroke="#b2bec3"/>
    <text x="105" y="154" text-anchor="middle">KPMG Future Analytics</text>
    <rect x="20" y="286" width="170" height="34" rx="8" fill="#eef2f3" stroke="#b2bec3"/>
    <text x="105" y="307" text-anchor="middle">MicroInspect</text>
    <rect x="20" y="445" width="170" height="34" rx="8" fill="#eef2f3" stroke="#b2bec3"/>
    <text x="105" y="466" text-anchor="middle">Gemmo AI</text>
  </g>

  <!-- ================= FAINT SERVICE DOTS (other categories) ================= -->
  <g fill="#cbd5db">
    <circle cx="742" cy="112" r="10"/><circle cx="600" cy="104" r="10"/><circle cx="726" cy="218" r="10"/>
    <circle cx="928" cy="298" r="10"/><circle cx="918" cy="388" r="10"/><circle cx="858" cy="428" r="10"/>
    <circle cx="820" cy="618" r="10"/><circle cx="678" cy="628" r="10"/><circle cx="812" cy="498" r="10"/>
    <circle cx="428" cy="720" r="10"/><circle cx="548" cy="708" r="10"/><circle cx="388" cy="578" r="10"/>
    <circle cx="118" cy="648" r="10"/><circle cx="262" cy="676" r="10"/><circle cx="138" cy="548" r="10"/>
  </g>

  <!-- ================= CATEGORY HUBS ================= -->
  <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="380" cy="300" r="46" fill="#1f6f78" stroke="#14505a" stroke-width="2"/><text x="380" y="305">AI</text>
    <circle cx="660" cy="160" r="46" fill="#1f6f78" stroke="#14505a" stroke-width="2"/><text x="660" y="165">Technology</text>
    <circle cx="850" cy="330" r="46" fill="#1f6f78" stroke="#14505a" stroke-width="2"/><text x="850" y="335">Data</text>
    <circle cx="740" cy="560" r="46" fill="#1f6f78" stroke="#14505a" stroke-width="2"/><text x="740" y="565">Business</text>
    <circle cx="470" cy="640" r="46" fill="#1f6f78" stroke="#14505a" stroke-width="2"/><text x="470" y="645">Skills</text>
    <circle cx="210" cy="600" r="46" fill="#1f6f78" stroke="#14505a" stroke-width="2"/><text x="210" y="605">Ecosystem</text>
  </g>

  <!-- ================= AI SERVICE DOTS (coloured by pillar) ================= -->
  <g stroke="#ffffff" stroke-width="2.5">
    <circle cx="235" cy="175" r="18" fill="#e74c3c"/>
    <circle cx="205" cy="300" r="18" fill="#3498db"/>
    <circle cx="235" cy="425" r="18" fill="#2ecc71"/>
  </g>
  <g font-size="12.5" fill="#222" text-anchor="middle">
    <text x="300" y="150">AI / Data Blueprint</text>
    <text x="252" y="272">Vision inspection pilot</text>
    <text x="258" y="452">AI readiness workshop</text>
  </g>

  <!-- ================= EXAMPLE PATH CALLOUT ================= -->
  <g>
    <rect x="720" y="92" width="392" height="78" rx="10" fill="#fff8ec" stroke="#f0c46a"/>
    <text x="740" y="120" font-size="14" font-weight="700" fill="#8a5a00">A strategist's path through the map</text>
    <text x="740" y="145" font-size="13.5" fill="#5c4a1a">Customer need  →  Category (AI)  →  Service (Blueprint)</text>
    <text x="740" y="163" font-size="13.5" fill="#5c4a1a">→  Partner (KPMG)</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <line x1="40" y1="706" x2="1100" y2="706" stroke="#e1e5ea" stroke-width="1.5"/>

  <!-- node type key -->
  <text x="40" y="734" font-size="13" font-weight="700" fill="#333">Node types</text>
  <circle cx="150" cy="730" r="14" fill="#1f6f78"/><text x="172" y="734" font-size="13" fill="#333">Category (hub)</text>
  <circle cx="300" cy="730" r="11" fill="#7f8c8d"/><text x="318" y="734" font-size="13" fill="#333">Service (colour = pillar)</text>
  <rect x="490" y="720" width="70" height="20" rx="6" fill="#eef2f3" stroke="#b2bec3"/><text x="572" y="734" font-size="13" fill="#333">Partner</text>
  <text x="655" y="734" font-size="13" fill="#333">— solid = in category · - - - dashed = delivered by</text>

  <!-- pillar colour key -->
  <text x="40" y="774" font-size="13" font-weight="700" fill="#333">Pillar = service colour</text>
  <circle cx="205" cy="770" r="9" fill="#3498db"/><text x="220" y="774" font-size="12.5" fill="#333">Test Before Invest</text>
  <circle cx="360" cy="770" r="9" fill="#2ecc71"/><text x="375" y="774" font-size="12.5" fill="#333">Skills &amp; Training</text>
  <circle cx="505" cy="770" r="9" fill="#f39c12"/><text x="520" y="774" font-size="12.5" fill="#333">Support to Find Investment</text>
  <circle cx="710" cy="770" r="9" fill="#9b59b6"/><text x="725" y="774" font-size="12.5" fill="#333">Partnerships &amp; Networking</text>
  <circle cx="905" cy="770" r="9" fill="#e74c3c"/><text x="920" y="774" font-size="12.5" fill="#333">Data &amp; AI Value Chain</text>
</svg>
