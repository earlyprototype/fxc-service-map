    <!-- TBI 41 -->
    <circle cx="58" cy="415" r="8" fill="#3498db"/><text x="76" y="419" fill="#333">Test Before Invest</text>
    <rect x="300" y="405" width="246" height="18" rx="3" fill="#3498db"/><text x="556" y="419" fill="#556">41</text>
