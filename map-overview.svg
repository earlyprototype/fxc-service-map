    <circle cx="58" cy="459" r="8" fill="#2ecc71"/><text x="76" y="463" fill="#333">Skills &amp; Training</text>
    <rect x="300" y="449" width="90" height="18" rx="3" fill="#2ecc71"/><text x="400" y="463" fill="#556">15</text>
    <!-- DataAI 11 -->
