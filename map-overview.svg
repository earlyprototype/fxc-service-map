    <text x="660" y="226" font-size="17" font-weight="700" fill="#fff">11</text>
    <text x="660" y="273" font-size="13.5" fill="#1f2933" font-weight="600">AI</text>
    <text x="660" y="290" font-size="11" fill="#8a97a0">+8 soft</text>
    <!-- Data 8 -->
