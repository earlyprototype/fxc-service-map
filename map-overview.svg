    <g><text x="600" y="520" fill="#333">Gemmo AI</text><rect x="770" y="510" width="65" height="13" rx="2" fill="#4a5a6a"/><text x="843" y="520" fill="#667">5</text></g>
    <g><text x="600" y="543" fill="#333">Mavarick AI</text><rect x="770" y="533" width="65" height="13" rx="2" fill="#4a5a6a"/><text x="843" y="543" fill="#667">5</text></g>
    <g><text x="600" y="566" fill="#333">TUS</text><rect x="770" y="556" width="65" height="13" rx="2" fill="#4a5a6a"/><text x="843" y="566" fill="#667">5</text></g>
    <g><text x="600" y="589" fill="#333">Impetus</text><rect x="770" y="579" width="52" height="13" rx="2" fill="#4a5a6a"/><text x="830" y="589" fill="#667">4</text></g>
    <g><text x="600" y="612" fill="#333">Saluto Partners</text><rect x="770" y="602" width="52" height="13" rx="2" fill="#4a5a6a"/><text x="830" y="612" fill="#667">4</text></g>
    <g><text x="600" y="635" fill="#333">MicroInspect</text><rect x="770" y="625" width="39" height="13" rx="2" fill="#4a5a6a"/><text x="817" y="635" fill="#667">3</text></g>
    <g><text x="600" y="658" fill="#333">Frontend</text><rect x="770" y="648" width="39" height="13" rx="2" fill="#4a5a6a"/><text x="817" y="658" fill="#667">3</text></g>
    <g><text x="600" y="681" fill="#333">Inventya</text><rect x="770" y="671" width="26" height="13" rx="2" fill="#4a5a6a"/><text x="804" y="681" fill="#667">2</text></g>
    <g><text x="600" y="704" fill="#333">Cyberlynk</text><rect x="770" y="694" width="26" height="13" rx="2" fill="#4a5a6a"/><text x="804" y="704" fill="#667">2</text></g>
