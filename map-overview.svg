  <text x="600" y="740" font-size="12" fill="#8a97a0">ICHEC (co-delivers the Blueprint), Monaru &amp; Piquant hold consortium roles — no bookable service.</text>

  <!-- footer legend of edges -->
  <line x1="40" y1="782" x2="1120" y2="782" stroke="#e6ebee" stroke-width="1.5"/>
  <g font-size="12.5" fill="#445">
    <text x="40" y="812" font-weight="700" fill="#333">Edges:</text>
    <line x1="110" y1="808" x2="150" y2="808" stroke="#8a97a0" stroke-width="2"/><text x="158" y="812">in category</text>
    <line x1="270" y1="808" x2="310" y2="808" stroke="#9fb0ba" stroke-width="2" stroke-dasharray="4 4"/><text x="318" y="812">soft category</text>
    <line x1="450" y1="808" x2="490" y2="808" stroke="#cfd8de" stroke-width="2"/><text x="498" y="812">delivered by (light)</text>
