    <g><text x="600" y="428" fill="#333">Creative Spark</text><rect x="770" y="418" width="104" height="13" rx="2" fill="#4a5a6a"/><text x="882" y="428" fill="#667">8</text></g>
    <g><text x="600" y="451" fill="#333">Futurecast</text><rect x="770" y="441" width="91" height="13" rx="2" fill="#4a5a6a"/><text x="869" y="451" fill="#667">7</text></g>
    <g><text x="600" y="474" fill="#333">TisaLabs</text><rect x="770" y="464" width="78" height="13" rx="2" fill="#4a5a6a"/><text x="856" y="474" fill="#667">6</text></g>
