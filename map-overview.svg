  <text x="40" y="46" font-size="25" font-weight="700" fill="#12333b">FactoryXChange 2.0 Service Map — built</text>
  <text x="40" y="74" font-size="13.5" fill="#667">17 partners · 73 services · 63 carry a soft second category · 212 connections · 14 partners sell, 3 consortium-role only</text>
